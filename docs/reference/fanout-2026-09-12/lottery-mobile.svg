<svg class="daily-opening-lottery-mobile" viewBox="0 0 390 520" role="img" aria-labelledby="daily-lottery-mobile-title daily-lottery-mobile-description"><title id="daily-lottery-mobile-title">A perforated sparse network lifted from a dense ticket</title><desc id="daily-lottery-mobile-description">A compact upright ticket shows faint unused connections behind a raised plate. The plate keeps a sparse seven-node network and its original initial values.</desc><text class="is-heading" x="195" y="27" text-anchor="middle">A WINNING TICKET HIDES INSIDE</text><rect class="is-mobile-ticket" x="24" y="55" width="342" height="390" rx="18"></rect><g class="is-mobile-ghost" aria-hidden="true"><circle cx="64" cy="300" r="8"></circle><circle cx="64" cy="398" r="8"></circle><circle cx="195" cy="276" r="8"></circle><circle cx="195" cy="349" r="8"></circle><circle cx="195" cy="422" r="8"></circle><circle cx="326" cy="300" r="8"></circle><circle cx="326" cy="398" r="8"></circle></g><g class="is-mobile-plate"><rect x="42" y="76" width="306" height="238" rx="14"></rect><text x="195" y="108" text-anchor="middle">FIXED 21% MASK</text><g class="is-sparse-mesh" aria-hidden="true"><line x1="64" y1="120" x2="195" y2="96"></line><line x1="64" y1="120" x2="195" y2="169"></line><line x1="64" y1="218" x2="195" y2="169"></line><line x1="64" y1="218" x2="195" y2="242"></line><line x1="195" y1="96" x2="326" y2="120"></line><line x1="195" y1="169" x2="326" y2="120"></line><line x1="195" y1="169" x2="326" y2="218"></line><line x1="195" y1="242" x2="326" y2="218"></line><circle cx="64" cy="120" r="8"></circle><circle cx="64" cy="218" r="8"></circle><circle cx="195" cy="96" r="8"></circle><circle cx="195" cy="169" r="8"></circle><circle cx="195" cy="242" r="8"></circle><circle cx="326" cy="120" r="8"></circle><circle cx="326" cy="218" r="8"></circle></g></g><g class="is-mobile-values"><text x="195" y="360" text-anchor="middle">ORIGINAL VALUES θ₀</text><text x="195" y="391" text-anchor="middle">+.12 · −.08 · +.31 · +.06</text></g><text class="is-footnote" x="195" y="480" text-anchor="middle">THE MASK ALONE IS NOT THE TICKET</text></svg>
